{% load static %}

<header class="navbar fixed top-0 left-0 right-0 z-50 transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-6 md:px-8">
    <div class="flex items-center justify-between h-18 py-4">

      <!-- Brand -->
      <div class="flex items-center space-x-3 rtl:space-x-reverse">
        <a href="/"
           class="navbar-home hidden md:flex items-center justify-center w-12 h-12 rounded-full"
           aria-label="home icon">
          <svg viewBox="0 0 24 24" class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10.5z"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a href="/"
           class="navbar-brand text-white text-xl md:text-2xl font-light tracking-tight flex items-center">
          <span class="sr-only">{{ brand.display_name }}</span>

          <span class="inline-block mr-3 rtl:mr-0 rtl:ml-3">
            <span class="w-9 h-9 rounded-lg bg-white/10 inline-flex items-center justify-center">
              <svg viewBox="0 0 24 24" class="w-5 h-5 text-white"
                   fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="4"
                        stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </span>

          <span class="hidden sm:inline">
            {{ brand.display_name }}
          </span>
        </a>
      </div>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center gap-6 font-medium text-gray-300 uppercase tracking-wider">
        {% for item in brand.navbar.menu %}
          <a href="{{ item.href }}"
             class="nav-link text-sm hover:text-white transition">
            {{ item.label }}
          </a>
        {% endfor %}
      </nav>

      <!-- CTA & Mobile toggle -->
      <div class="flex items-center gap-3">
        <a href="#contact"
           class="hidden md:inline-block px-4 py-2 rounded-lg
                  bg-[color:var(--primary)] text-white font-semibold shadow
                  hover:bg-[color:var(--primary-dark)] transition">
          {{ brand.navbar.cta_text }}
        </a>

        <button id="mobile-toggle"
                aria-expanded="false"
                aria-label="Open menu"
                class="md:hidden p-2 text-white rounded hover:bg-white/10 transition">
          <svg viewBox="0 0 24 24" class="w-6 h-6"
               fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 7h16M4 12h16M4 17h16"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Panel -->
  <div id="mobile-panel"
       class="mobile-panel md:hidden bg-[rgba(15,15,20,0.7)] backdrop-blur-sm">
    <div class="px-6 py-4">
      <nav class="flex flex-col gap-2">
        {% for item in brand.navbar.menu %}
          <a href="{{ item.href }}"
             class="block px-3 py-3 rounded text-white hover:bg-white/5">
            {{ item.label }}
          </a>
        {% endfor %}

        <a href="#contact"
           class="mt-2 block px-3 py-3 rounded
                  text-[color:var(--primary)] bg-white/10 font-semibold
                  hover:bg-white/20">
          {{ brand.navbar.cta_text }}
        </a>
      </nav>
    </div>
  </div>
</header>
